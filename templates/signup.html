<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign up | Safe Drive</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>:root{--bg:#020617;--card:#0f172a;--line:rgba(255,255,255,.09);--tx:#e2e8f0;--mut:#94a3b8;--ac:#22c55e;--bl:#38bdf8}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.6}
a{color:inherit;text-decoration:none}.btn{display:inline-block;background:var(--ac);color:#02120a;font-weight:800;border:0;border-radius:12px;padding:14px 24px;cursor:pointer;font-size:14px}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line)}.btn:disabled{background:#334155;color:#64748b;cursor:not-allowed}
.logo{font-weight:900;font-size:20px;letter-spacing:-.5px}.logo b{color:var(--ac)}
body{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px}
.box{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:34px 28px;width:100%;max-width:420px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#1e293b;border-radius:12px;padding:4px;margin:20px 0 6px}
.tabs button{background:none;border:0;color:var(--mut);font:inherit;font-weight:700;padding:11px;border-radius:9px;cursor:pointer}.tabs .on{background:var(--ac);color:#02120a}
label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:14px 0 6px}
input[type=text],input[type=email],input[type=password]{width:100%;background:#1e293b;border:1px solid var(--line);color:#fff;border-radius:12px;padding:13px;font:inherit;outline:none}
input:focus{border-color:var(--ac)}.chk{display:flex;gap:10px;font-size:12px;color:var(--mut);margin-top:18px}.chk a{color:var(--ac)}
.btn{width:100%;margin-top:18px}.msg{font-size:12px;margin-top:5px;color:#fb7185;display:none}.sub{margin-top:16px;font-size:13px;color:var(--mut);text-align:center}.sub a{color:var(--ac);font-weight:700}
.st{display:none}.ov{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:20px}
.ov .box{text-align:center}.ov input{text-align:center;font-size:26px;letter-spacing:10px}
</style></head><body><div class="box"><a class="logo" href="index.html">SAFE<b>DRIVE</b></a>
<div class="tabs"><button id="tP" class="on">Parent</button><button id="tS">School station</button></div>
<label>Full name</label><input type="text" id="name">
<div class="st"><label>School name</label><input type="text" id="school"><label>School code (you choose it; parents use it to find the school)</label><input type="text" id="code"></div>
<label>Username</label><input type="text" id="user"><div class="msg" id="uMsg">That username is taken.</div>
<label>Email</label><input type="email" id="email"><label>Password</label><input type="password" id="pass">
<label class="chk"><input type="checkbox" id="terms"><span>I agree to the <a href="terms.html" target="_blank">Terms</a> and <a href="privacy.html" target="_blank">Privacy Policy</a>.</span></label>
<div class="msg" id="eMsg"></div><button class="btn" id="go" disabled>Create account</button>
<p class="sub">Already registered? <a href="login.html">Log in</a>. You can add your children from your dashboard.</p></div>
<div class="ov" id="ov"><div class="box"><h3>Check your email</h3><p class="sub">Enter the 4-digit code we sent.</p>
<input type="text" id="otp" maxlength="4" inputmode="numeric" style="margin-top:16px"><div class="msg" id="oMsg"></div>
<button class="btn" id="ok">Confirm</button></div></div>
<script>
const $=i=>document.getElementById(i);let role='general',taken=false;
function setRole(r){role=r;document.querySelectorAll('.st').forEach(e=>e.style.display=r==='principal'?'block':'none');
 $('tP').classList.toggle('on',r==='general');$('tS').classList.toggle('on',r==='principal')}
$('tP').onclick=()=>setRole('general');$('tS').onclick=()=>setRole('principal');
if(new URLSearchParams(location.search).get('role')==='station')setRole('principal');
function gate(){$('go').disabled=taken||!$('terms').checked}$('terms').onchange=gate;
$('user').oninput=async()=>{const u=$('user').value.trim().toLowerCase();if(u.length<3){taken=false;$('uMsg').style.display='none';return gate()}
 try{const r=await fetch('/api/check_availability',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u})});taken=!!(await r.json()).username_taken}catch(e){taken=false}
 $('uMsg').style.display=taken?'block':'none';gate()};
function bad(t){$('eMsg').textContent=t;$('eMsg').style.display='block'}
$('go').onclick=async()=>{
 const v=k=>$(k).value.trim(),b={name:v('name'),username:v('user').toLowerCase(),email:v('email'),password:$('pass').value,terms_accepted:true};
 if(!b.name||!b.username||!b.email||!b.password)return bad('Fill in every field.');
 if(b.password.length<8)return bad('Password needs at least 8 characters.');
 if(role==='principal'){b.school_name=v('school');b.school_code=v('code').toUpperCase();if(!b.school_name||!b.school_code)return bad('Add the school name and code.')}
 $('go').disabled=true;$('go').textContent='Sending code...';$('eMsg').style.display='none';
 try{const r=await fetch('/api/'+role+'/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const d=await r.json();
  if(d.status==='pending'){$('ov').style.display='flex'}else bad(d.message||'Could not register.')}
 catch(e){bad('Cannot reach the server. Try again.')}
 $('go').textContent='Create account';gate()};
$('ok').onclick=async()=>{const code=$('otp').value.trim();if(code.length!==4){$('oMsg').textContent='Enter 4 digits.';$('oMsg').style.display='block';return}
 try{const r=await fetch('/api/verify-and-save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('user').value.trim().toLowerCase(),code})});const d=await r.json();
  if(d.status==='success')location.href='login.html';else{$('oMsg').textContent='That code is not right.';$('oMsg').style.display='block'}}
 catch(e){$('oMsg').textContent='Server error. Try again.';$('oMsg').style.display='block'}};
</script></body></html>
