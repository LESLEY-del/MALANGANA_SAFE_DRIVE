<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log in | Safe Drive</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>:root{--bg:#020617;--card:#0f172a;--line:rgba(255,255,255,.09);--tx:#e2e8f0;--mut:#94a3b8;--ac:#22c55e;--bl:#38bdf8}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.6}
a{color:inherit;text-decoration:none}.btn{display:inline-block;background:var(--ac);color:#02120a;font-weight:800;border:0;border-radius:12px;padding:14px 24px;cursor:pointer;font-size:14px}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line)}.btn:disabled{background:#334155;color:#64748b;cursor:not-allowed}
.logo{font-weight:900;font-size:20px;letter-spacing:-.5px}.logo b{color:var(--ac)}
body{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px}
.box{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:36px 30px;width:100%;max-width:400px}
.box h1{font-size:24px;margin:18px 0 22px}label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:14px 0 6px}
input{width:100%;background:#1e293b;border:1px solid var(--line);color:#fff;border-radius:12px;padding:14px;font:inherit;outline:none}input:focus{border-color:var(--ac)}
.btn{width:100%;margin-top:22px}.sub{margin-top:18px;font-size:13px;color:var(--mut);display:flex;justify-content:space-between}.sub a{color:var(--ac);font-weight:700}
#err{color:#fb7185;font-size:13px;margin-top:12px;display:none}
</style></head><body><div class="box"><a class="logo" href="index.html">SAFE<b>DRIVE</b></a><h1>Log in</h1>
<label>Username</label><input id="u" autocomplete="username"><label>Password</label><input id="p" type="password" autocomplete="current-password">
<div id="err"></div><button class="btn" id="go">Log in</button>
<div class="sub"><a href="reset_password.html">Forgot password?</a><span>New? <a href="signup.html">Sign up</a></span></div></div>
<script>
const go=document.getElementById('go'),err=document.getElementById('err');
async function login(){
 const u=document.getElementById('u').value.trim().toLowerCase(),p=document.getElementById('p').value;
 if(!u||!p){err.textContent='Enter your username and password.';err.style.display='block';return}
 go.disabled=true;go.textContent='Checking...';err.style.display='none';
 try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
  const d=await r.json();
  if(d.status!=='success'){err.textContent=d.msg||'Wrong username or password.';err.style.display='block';go.disabled=false;go.textContent='Log in';return}
  sessionStorage.clear();
  sessionStorage.setItem('authToken',d.token);sessionStorage.setItem('username',d.username);sessionStorage.setItem('userRole',d.role);
  sessionStorage.setItem('userName',d.name);sessionStorage.setItem('school_code',d.school_code||'');
  const t={admin:'admin_dashboard.html',principal:'station_dashboard.html'};
  location.replace(t[d.role.toLowerCase()]||'parent_dashboard.html');
 }catch(e){err.textContent='Cannot reach the server. Try again.';err.style.display='block';go.disabled=false;go.textContent='Log in'}}
go.onclick=login;document.getElementById('p').addEventListener('keydown',e=>e.key==='Enter'&&login());
</script></body></html>
