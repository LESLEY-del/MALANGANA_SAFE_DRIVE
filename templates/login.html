<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Safe Drive | Secure Authentication</title> 
    <link rel="icon" href="/SAFE DRIVE/favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet"> 
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style> 
        :root { 

            --primary: #f8fafc; 

            --accent: #27ae60; 

            --bg: #0f172a; 

            --card-bg: #1e293b; 

            --input-bg: #334155;

            --text-muted: #94a3b8; 

            --border: #334155;

        } 



        body { 

            background: var(--bg); 

            margin: 0; 

            font-family: 'Inter', sans-serif; 

            display: flex; 

            justify-content: center; 

            align-items: center; 

            height: 100vh; 

            color: var(--primary); 

        } 



        .card { 

            background: var(--card-bg); 

            width: 100%; 

            max-width: 400px; 

            border-radius: 24px; 

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); 

            padding: 50px 40px; 

            text-align: center; 

            border: 1px solid var(--border); 

            box-sizing: border-box;

        } 



        .brand-logo { 

            font-size: 2rem; 

            font-weight: 800; 

            letter-spacing: -1.5px; 

            margin-bottom: 5px; 

        } 



        .brand-logo span { 

            color: var(--accent); 

        } 



        .subtitle { 

            color: var(--text-muted); 

            font-size: 14px; 

            margin-bottom: 40px; 

            font-weight: 400; 

        } 



        .form-group { 

            text-align: left; 

            margin-bottom: 20px; 

        } 



        .form-group label { 

            display: block; 

            font-size: 12px; 

            font-weight: 700; 

            margin-bottom: 8px; 

            text-transform: uppercase; 

            letter-spacing: 0.5px; 

            color: var(--text-muted); 

        } 



        .input-field { 

            width: 100%; 

            box-sizing: border-box; 

            background: var(--input-bg); 

            border: 1px solid var(--border); 

            border-radius: 12px; 

            height: 55px; 

            padding: 0 18px; 

            font-size: 15px; 

            font-family: inherit; 

            transition: all 0.2s ease; 

            outline: none; 

            color: #fff;

        } 



        .input-field:focus { 

            border-color: var(--accent); 

            background: #2d3748; 

            box-shadow: 0 0 0 4px rgba(39, 174, 96, 0.1); 

        } 

        .back-link {
    position: absolute;
    top: 25px;
    left: 25px;

    display: inline-flex;
    align-items: center;
    gap: 7px;

    color: var(--text-dim);
    text-decoration: none;

    font-size: 13px;
    font-weight: 700;

    padding: 9px 13px;
    border-radius: 10px;

    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);

    transition: all 0.25s ease;
}

.back-link:hover {
    color: white;
    background: rgba(14,184,166,0.12);
    border-color: var(--accent);
    transform: translateX(-3px);
}
        .back-link:hover { color: var(--accent); }



        .btn-login { 

            background: var(--accent); 

            color: #fff; 

            width: 100%; 

            height: 55px; 

            border-radius: 14px; 

            font-weight: 700; 

            font-size: 16px; 

            border: none; 

            cursor: pointer; 

            margin-top: 15px; 

            transition: transform 0.2s, background 0.2s; 

        } 



        .btn-login:hover { 

            background: #219150; 

            transform: translateY(-1px); 

        } 



        .btn-login:disabled {

            background: #475569;

            cursor: not-allowed;

            transform: none;

        }



        .footer-links { 

            margin-top: 30px; 

            font-size: 14px; 

            color: var(--text-muted); 

        } 



        .footer-links a { 

            color: var(--accent); 

            text-decoration: none; 

            font-weight: 700; 

            margin-left: 5px; 

        } 



        .forgot-link {

            font-size: 12px;

            color: var(--accent);

            text-decoration: none;

            float: right;

            margin-top: 8px;

            font-weight: 600;

            transition: 0.2s;

        }

        .forgot-link:hover { color: #fff; }



        .app-alert-overlay {

            position: fixed;

            top: 0; left: 0; width: 100%; height: 100%;

            background: rgba(0, 0, 0, 0.7);

            display: flex;

            justify-content: center;

            align-items: center;

            z-index: 9999;

            opacity: 0;

            pointer-events: none;

            backdrop-filter: blur(4px);

            transition: opacity 0.3s ease;

        }



        .app-alert-overlay.show {

            opacity: 1;

            pointer-events: auto;

        }



        .app-alert-box {

            background: var(--card-bg);

            border: 1px solid var(--border);

            border-radius: 20px;

            padding: 30px 25px;

            width: 85%;

            max-width: 320px;

            text-align: center;

            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);

            transform: scale(0.9);

            transition: transform 0.3s ease;

        }



        .app-alert-overlay.show .app-alert-box {

            transform: scale(1);

        }



        .app-alert-message {

            color: var(--primary);

            font-size: 14px;

            line-height: 1.5;

            margin-bottom: 25px;

            margin-top: 0;

        }



        .app-alert-btn {

            background: var(--accent);

            color: white;

            border: none;

            padding: 12px 0;

            border-radius: 12px;

            font-weight: 600;

            font-size: 14px;

            width: 100%;

            cursor: pointer;

            text-transform: uppercase;

            letter-spacing: 0.5px;

        }

    </style> 

</head> 

<body> 



    <div class="card"> 

        <div class="brand-logo">SAFE<span>DRIVE</span></div> 

        <p class="subtitle">Secure Logistics Oversight Portal</p> 



        <div class="form-group"> 

            <label>Username</label> 

            <input type="text" id="username" placeholder="Enter your identifier" class="input-field"> 

        </div> 



        <div class="form-group"> 

            <label>Password</label> 

            <input type="password" id="password" placeholder="••••••••" class="input-field"> 

            <a href="reset_password.html" class="forgot-link">Forgot Password?</a>

        </div> 



        <button id="loginBtn" class="btn-login">AUTHENTICATE</button> 



        <div class="footer-links"> 

            Don't have an account? <a href="choice.html">Register Identity</a> 

        </div> 
        <br>
        <br>

        <a href="index.html" class="back-link">
    &#8592; Back to Home
</a>

    </div> 



    <div id="appAlertOverlay" class="app-alert-overlay">

        <div class="app-alert-box">

            <h3 style="margin-top: 0; color: #e74c3c; font-size: 18px; margin-bottom: 10px;">Notice</h3>

            <p id="appAlertMessage" class="app-alert-message"></p>

            <button onclick="closeAppAlert()" class="app-alert-btn">OK</button>

        </div>

    </div>



    <script>
    function showAppAlert(message) {
        document.getElementById("appAlertMessage").innerText = message;
        document.getElementById("appAlertOverlay").classList.add("show");
    }

    function closeAppAlert() {
        document.getElementById("appAlertOverlay").classList.remove("show");
    }

    document.getElementById("loginBtn").addEventListener("click", async () => {

        const u = document.getElementById("username").value.trim().toLowerCase();
        const p = document.getElementById("password").value.trim();
        const btn = document.getElementById("loginBtn");

        if (!u || !p) {
            return showAppAlert("Security Check: Please provide both username and password.");
        }

        btn.innerText = "VERIFYING IDENTITY...";
        btn.disabled = true;

        try {

            // SEND LOGIN TO PYTHON FLASK BACKEND
            const response = await fetch("/api/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username: u,
                    password: p
                })
            });

            const result = await response.json();

            if (result.status === "success") {

                const theme = localStorage.getItem('safe_drive_theme');

                localStorage.clear();

                if (theme) {
                    localStorage.setItem('safe_drive_theme', theme);
                }

                sessionStorage.clear();

                sessionStorage.setItem('authToken', result.token);

                sessionStorage.setItem('username', result.username);
                sessionStorage.setItem('userRole', result.role);
                sessionStorage.setItem('userName', result.name);
                sessionStorage.setItem('school_code', result.school_code || "");
                sessionStorage.setItem('moderated_grade', result.moderated_grade || "");

                const role = result.role.toLowerCase();

                if (role === 'admin') {
                    window.location.replace("admin_dashboard.html");
                }

                else if (role === 'principal') {
                    window.location.replace("principal_dashboard.html");
                }
                else if (role === 'driver') {
                    window.location.replace("driver_dashboard.html");
                }
                else if (role === 'student') {
                    window.location.replace("student_dashboard.html");
                }
                else if (role === 'moderator' || role === 'teacher') {
                    window.location.replace("moderator_dashboard.html");
                }
                else {
                    window.location.replace("general_dashboard.html");
                }

            } else {

                showAppAlert(result.msg || "Authentication Failed.");

                btn.innerText = "AUTHENTICATE";
                btn.disabled = false;
            }

        } catch (e) {

            console.error(e);

            showAppAlert("Connection Error: Flask authentication server offline.");

            btn.innerText = "AUTHENTICATE";
            btn.disabled = false;
        }

    });
</script>

</body> 

</html>
