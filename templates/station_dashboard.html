<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>School Station | Safe Drive</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--bg:#0b141a;--card:#111b21;--nav:#202c33;--tx:#e9edef;--mut:#8696a0;--ac:#25D366;--dg:#ef4444;--bd:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--tx);font-family:Inter,sans-serif}
#top{position:fixed;top:0;left:0;right:0;height:56px;z-index:50;background:var(--nav);display:flex;align-items:center;gap:6px;padding:0 10px}
#top b{flex:1;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab{background:none;border:0;color:var(--mut);font:700 13px Inter;padding:10px 12px;border-radius:10px;cursor:pointer}.tab.on{color:#fff;background:rgba(255,255,255,.1)}
.vw{display:none;padding:66px 0 30px}.vw.on{display:block}
#v-scan{position:fixed;inset:56px 0 0 0;padding:0;background:#000}#reader{position:absolute;inset:0}#reader video{width:100%!important;height:100%!important;object-fit:cover}
#seg{position:absolute;z-index:5;top:12px;left:50%;transform:translateX(-50%);display:flex;background:rgba(0,0,0,.6);border-radius:30px;padding:4px}
#seg button{border:0;background:none;color:#fff;font:700 14px Inter;padding:11px 20px;border-radius:26px;cursor:pointer}#seg .on{background:var(--ac);color:#02120a}
#flip{position:absolute;z-index:5;right:14px;bottom:24px;width:50px;height:50px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:20px}
#cnt{position:absolute;z-index:5;left:14px;bottom:34px;color:#fff;font-weight:700;text-shadow:0 1px 4px #000}
#toast{position:absolute;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);min-width:240px;text-align:center;padding:22px 26px;border-radius:20px;font-weight:800;font-size:20px;opacity:0;pointer-events:none;transition:.2s}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}#toast.ok{background:var(--ac);color:#02120a}#toast.no{background:var(--dg);color:#fff}#toast small{display:block;font-size:12px;font-weight:600;margin-top:4px}
.row{display:flex;gap:12px;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--bd)}
.row img{width:48px;height:48px;border-radius:12px;object-fit:cover;background:#2a3942}.row div{flex:1;min-width:0}.row b{display:block}.row small{color:var(--mut)}.tag{font-weight:800;font-size:11px;color:var(--ac)}
input{width:calc(100% - 32px);margin:0 16px 12px;background:#2a3942;border:0;color:var(--tx);padding:13px 16px;border-radius:24px;font:15px Inter;outline:0}
.md{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}.md.on{display:flex}
.mb{background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:340px}.b{display:block;width:100%;border:0;border-radius:10px;padding:14px;font:700 14px Inter;cursor:pointer;margin-top:10px;background:#2a3942;color:var(--tx)}.b.r{background:var(--dg);color:#fff}
.mut{color:var(--mut);padding:20px;text-align:center}
</style></head><body>
<div id="top"><b id="nm">Station</b><button class="tab on" data-t="scan">Scan</button><button class="tab" data-t="today">Today</button><button class="tab" data-t="roster">Learners</button><button class="tab" onclick="show('mMenu')">⋮</button></div>

<div class="vw on" id="v-scan"><div id="reader"></div>
<div id="seg"><button data-m="ARRIVED" class="on">Arriving</button><button data-m="DISMISSED">Leaving</button></div>
<div id="cnt"></div><button id="flip" onclick="flip()">⟲</button><div id="toast"></div></div>
<div class="vw" id="v-today"><div id="tl"></div></div>
<div class="vw" id="v-roster"><input id="q" placeholder="Search learner or grade" oninput="drawRoster()"><div id="rl"></div></div>

<div class="md" id="mMenu"><div class="mb"><h3>School station</h3>
<button class="b r" onclick="schoolOut()">📢 School is out (alert all parents)</button><button class="b" onclick="logout()">Log out</button><button class="b" onclick="hide('mMenu')">Close</button></div></div>

<script>
const $=i=>document.getElementById(i),tok=sessionStorage.getItem('authToken');
if(!tok||sessionStorage.getItem('userRole')!=='principal')location.replace('login.html');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const show=i=>$(i).classList.add('on'),hide=i=>$(i).classList.remove('on');
$('nm').textContent=sessionStorage.getItem('userName')||'Station';
async function api(p,b){const r=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},body:JSON.stringify(b||{})});if(r.status===401)logout();return r.json().catch(()=>({}))}
function logout(){sessionStorage.clear();location.replace('login.html')}
let sc=null,busy=false,recent={},facing='user',mode=localStorage.getItem('smode')||'ARRIVED',n=0,roster=[];
/* tabs */
document.querySelectorAll('.tab[data-t]').forEach(b=>b.onclick=()=>{const t=b.dataset.t;document.querySelectorAll('.tab[data-t]').forEach(x=>x.classList.toggle('on',x===b));
 document.querySelectorAll('.vw').forEach(v=>v.classList.remove('on'));$('v-'+t).classList.add('on');
 t==='scan'?startScan():stopScan();if(t==='today')loadToday();if(t==='roster')loadRoster()});
/* mode */
function setMode(m){mode=m;localStorage.setItem('smode',m);document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.m===m))}
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));setMode(mode);
/* scanner: reads the whole camera frame, no box to line up */
async function startScan(){if(sc)return;sc=new Html5Qrcode('reader',{formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE],verbose:false});
 try{await sc.start({facingMode:facing},{fps:15,aspectRatio:window.innerHeight/window.innerWidth},onScan,()=>{})}catch(e){sc=null;toast('Allow camera access','no','Then reload this page')}}
async function stopScan(){if(sc){try{await sc.stop();sc.clear()}catch(e){}sc=null}}
async function flip(){facing=facing==='user'?'environment':'user';await stopScan();startScan()}
function snap(){const v=document.querySelector('#reader video');if(!v||!v.videoWidth)return null;const w=Math.min(v.videoWidth,640),h=Math.round(w*v.videoHeight/v.videoWidth),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(v,0,0,w,h);return c.toDataURL('image/jpeg',.7)}
function beep(f){try{const a=new AudioContext(),o=a.createOscillator();o.frequency.value=f;o.connect(a.destination);o.start();o.stop(a.currentTime+.12)}catch(e){}}
let tt;function toast(a,c,b){const t=$('toast');t.className='on '+c;t.innerHTML=esc(a)+(b?`<small>${esc(b)}</small>`:'');clearTimeout(tt);tt=setTimeout(()=>t.className='',1600)}
async function onScan(code){const now=Date.now();if(busy||(recent[code]&&now-recent[code]<8000))return;busy=true;recent[code]=now;
 try{const d=await api('/api/principal/scan_attendance',{qr_token:code,status:mode,photo:snap()});
  if(d.status==='success'){n++;$('cnt').textContent=n+' scanned';toast(d.student_name,'ok',d.attendance_status==='ARRIVED'?'Arrived. Parent notified.':'Dismissed. Parent notified.');beep(880)}
  else{toast(d.message||'Scan failed','no');beep(220)}}catch(e){toast('Network error','no')}
 setTimeout(()=>busy=false,900)}
/* lists */
async function loadToday(){const d=await api('/api/station/logs');$('tl').innerHTML=(d.logs||[]).map(x=>`<div class="row">${x.photo_url?`<img src="${esc(x.photo_url)}">`:'<img>'}<div><b>${esc(x.child_name)}</b><small>${new Date(x.timestamp).toLocaleString()}</small></div><span class="tag">${esc(x.status)}</span></div>`).join('')||'<div class="mut">No scans yet.</div>'}
async function loadRoster(){const d=await api('/api/station/roster');roster=d.children||[];drawRoster()}
function drawRoster(){const q=$('q').value.toLowerCase();$('rl').innerHTML=roster.filter(c=>(c.name+' '+c.surname+' '+(c.grade||'')).toLowerCase().includes(q)).map(c=>`<div class="row"><img src="${esc(c.photo||'https://ui-avatars.com/api/?background=22c55e&color=fff&name='+encodeURIComponent(c.name))}"><div><b>${esc(c.name)} ${esc(c.surname)}</b><small>Grade ${esc(c.grade||'-')}</small></div></div>`).join('')||'<div class="mut">No learners registered yet.</div>'}
async function schoolOut(){if(!confirm('Tell every parent that school is out?'))return;const d=await api('/api/principal/school_out');hide('mMenu');alert(d.status==='success'?`Sent to ${d.notified} parents.`:'Could not send.')}
startScan();
</script></body></html>
