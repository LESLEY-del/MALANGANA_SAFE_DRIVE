<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>SAFE DRIVE - Choose Role</title> 
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet"> 
    <style> 
        :root {
            --bg: #0f172a;
            --header-bg: #020218;
            --card-bg: #1e293b;
            --btn-bg: #334155;
            --btn-border: #475569;
            --accent: #0eb8a6;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        body { 
            margin: 0; 
            padding: 0; 
            font-family: Arial, sans-serif; 
            background-color: var(--bg); 
            color: var(--text-main);
            min-height: 100vh;
        } 
 
        .header-bar { 
            width: 100vw; 
            height: 15vh; 
            background-color: var(--header-bg); 
            display: flex; 
            align-items: center; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        } 
 
        .header-logo { 
            width: 10vh;  
            height: 10vh; 
            border-radius: 50%; 
            margin-left: 5vw; 
            object-fit: cover; 
        } 
 
        .header-title { 
            color: white; 
            font-size: 5vh; 
            margin-left: 3vw; 
        } 
 
        .login-card { 
            width: 90%;
            max-width: 380px;  
            min-height: 60vh; 
            background-color: var(--card-bg); 
            margin: 6vh auto;  
            border-radius: 40px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 40px 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.5); 
            box-sizing: border-box;
            position: relative; 
        } 
 
        .back-link {
    position: absolute;
    top: 25px;
    left: 25px;

    display: inline-flex;
    align-items: center;
    gap: 7px;

    color: var(--text-dim);
    text-decoration: none;

    font-size: 13px;
    font-weight: 700;

    padding: 9px 13px;
    border-radius: 10px;

    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);

    transition: all 0.25s ease;
}

.back-link:hover {
    color: white;
    background: rgba(14,184,166,0.12);
    border-color: var(--accent);
    transform: translateX(-3px);
}
        .back-link:hover { color: var(--accent); }

        .card-logo { 
            width: 12vh; 
            height: 12vh; 
            margin-bottom: 10px; 
        } 
 
        .card-title { 
            color: var(--text-main); 
            margin-bottom: 5px; 
            font-size: 2rem; 
        } 
 
        .card-subtitle { 
            font-size: 11px; 
            color: var(--text-dim); 
            margin-bottom: 30px; 
            font-weight: bold; 
            letter-spacing: 1px;
        } 
 
        .role-button { 
            display: flex; 
            align-items: center; 
            justify-content: flex-start;  
            width: 85%; 
            height: 65px; 
            gap: 15px; 
            border-radius: 18px; 
            border: 2px solid var(--btn-border); 
            background: var(--btn-bg); 
            cursor: pointer; 
            padding: 0 20px; 
            margin-bottom: 15px; 
            transition: all 0.2s ease; 
        } 
 
        .role-button:hover { 
            border-color: var(--accent); 
            background-color: #2d3748; 
            transform: translateY(-2px); 
            box-shadow: 0 5px 15px rgba(14, 184, 166, 0.2);
        } 
 
        .role-button img { 
            height: 30px; 
            width: 30px; 
            object-fit: contain; 
            filter: brightness(1.2);
        } 
 
        .role-button p { 
            margin: 0; 
            font-weight: bold; 
            color: white; 
            letter-spacing: 1px; 
            font-size: 14px; 
        } 

        @media (max-width: 600px) {
            .header-title { font-size: 3.5vh; }
            .login-card { margin: 5vh auto; border-radius: 30px; }
        }
    </style> 
</head> 
 
<body> 
    <div class="header-bar"> 
        <img src="images/image copy 3.png" alt="SAFE DRIVE Logo" class="header-logo" 
        onerror="this.style.display='none'">  
        <h1 class="header-title">SAFE DRIVE</h1> 
    </div> 
 
    <div class="login-card"> 
        <a href="index.html" class="back-link">
    &#8592; Back to Home
</a>

        <img src="images/image copy.png" alt="Bus Logo" class="card-logo" 
        onerror="this.style.display='none'"> 
        <h1 class="card-title">SIGN UP</h1> 
        <p class="card-subtitle">PLEASE CHOOSE CORRECTLY BELOW</p> 
 
        <button class="role-button" id="btn"> 
            <img src="images/image.png" alt="Student Icon" onerror="this.style.display='none'"> 
            <p>STUDENT</p> 
        </button> 
          
        <button class="role-button" id="btn2"> 
            <img src="images/image copy 2.png" alt="Principal Icon" onerror="this.style.display='none'"> 
            <p>PRINCIPAL</p> 
        </button> 
          
        <button class="role-button" id="btn3"> 
            <img src="images/image copy 4.png" alt="Driver Icon" onerror="this.style.display='none'"> 
            <p>TAXI/CAR</p> 
        </button> 
 
        <button class="role-button" id="btn4"> 
            <img src="images/image.png" alt="Public Icon" onerror="this.style.display='none'"> 
            <p>GENERAL PUBLIC</p> 
        </button> 

        <button class="role-button" id="btn5"> 
            <img src="images/image.png" alt="Moderator Icon" onerror="this.style.display='none'"> 
            <p>MODERATOR</p> 
        </button> 
    </div> 
 
    <script> 
        // Redirects based on button clicked 
        document.getElementById("btn").addEventListener("click", function() { 
            window.location.href = "student_signup.html"; 
        }); 
          
        document.getElementById("btn2").addEventListener("click", function() { 
            window.location.href = "principal_signup.html"; 
        }); 
          
        document.getElementById("btn3").addEventListener("click", function() { 
            window.location.href = "driver_signup.html"; 
        }); 
 
        document.getElementById("btn4").addEventListener("click", function() { 
            window.location.href = "general_signup.html"; 
        }); 

        document.getElementById("btn5").addEventListener("click", function() { 
            window.location.href = "moderatore_signup.html"; 
        }); 
    </script> 
</body> 
</html>
