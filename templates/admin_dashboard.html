<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin | Safe Drive</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b141a;--card:#111b21;--nav:#202c33;--tx:#e9edef;--mut:#8696a0;--ac:#3b82f6;--ok:#10b981;--wn:#f59e0b;--dg:#ef4444;--bd:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--tx);font-family:Inter,sans-serif}
.hd{background:var(--nav);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}.hd b{font-size:17px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--card);position:sticky;top:52px;z-index:4;border-bottom:1px solid var(--bd)}
.tab{flex:none;border:0;background:none;color:var(--mut);font:700 13px Inter;padding:9px 14px;border-radius:20px;cursor:pointer}.tab.on{background:var(--ac);color:#fff}
.vw{display:none;padding:14px}.vw.on{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}.st h2{font-size:26px}.st p{color:var(--mut);font-size:12px;margin-top:4px}
.row{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:13px 14px;margin-bottom:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row .m{flex:1;min-width:180px}.row small{display:block;color:var(--mut);font-size:12px}
.b{border:0;border-radius:9px;padding:10px 13px;font:700 12px Inter;cursor:pointer;background:var(--ac);color:#fff}.b.g{background:#2a3942}.b.r{background:var(--dg)}.b.o{background:var(--ok)}
.tag{font:800 11px Inter;padding:4px 9px;border-radius:12px;background:#2a3942}.tag.ok{background:rgba(16,185,129,.2);color:var(--ok)}.tag.wn{background:rgba(245,158,11,.2);color:var(--wn)}
input,select{background:#2a3942;border:0;color:var(--tx);padding:12px 14px;border-radius:10px;font:14px Inter;outline:0;margin-bottom:12px;width:100%}
.mut{color:var(--mut);text-align:center;padding:24px}
</style></head><body>
<div class="hd"><b>SAFE DRIVE ADMIN</b><button class="b g" onclick="logout()">Log out</button></div>
<div class="tabs" id="tabs"></div>
<div class="vw on" id="v-ov"><div class="grid" id="ov"></div></div>
<div class="vw" id="v-pay"><div id="pay"></div></div>
<div class="vw" id="v-prt"><select id="pf" onchange="drawPrt()"><option value="reprint_pending">Needs approval</option><option value="requested">Ready to print</option><option value="printed">Printed</option><option value="">All</option></select><div id="prt"></div></div>
<div class="vw" id="v-kid"><input id="kq" placeholder="Search child, school or parent" oninput="drawKids()"><div id="kid"></div></div>
<div class="vw" id="v-par"><input id="pq" placeholder="Search parent" oninput="drawPar()"><div id="par"></div></div>
<div class="vw" id="v-sta"><div id="sta"></div></div>
<div class="vw" id="v-grp"><div id="grp"></div></div>
<script>
const $=i=>document.getElementById(i),tok=sessionStorage.getItem('authToken');
if(!tok||sessionStorage.getItem('userRole')!=='admin')location.replace('login.html');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(p,b){const r=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},body:JSON.stringify(b||{})});if(r.status===401)logout();return r.json().catch(()=>({}))}
function logout(){sessionStorage.clear();location.replace('login.html')}
const T=[['ov','Overview'],['pay','Payments'],['prt','Card printing'],['kid','Children'],['par','Parents'],['sta','School stations'],['grp','Groups']];
$('tabs').innerHTML=T.map(([k,n])=>`<button class="tab${k==='ov'?' on':''}" data-t="${k}">${n}</button>`).join('');
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));
 document.querySelectorAll('.vw').forEach(v=>v.classList.remove('on'));$('v-'+(b.dataset.t==='ov'?'ov':b.dataset.t)).classList.add('on')});
let U={},PAY=[],PR=[];const fd=t=>t?new Date(t).toLocaleString():'-',empty='<div class="mut">Nothing here yet.</div>';
const active=k=>k.plan&&k.paid_until&&new Date(k.paid_until)>new Date();
async function load(){const[o,u,p,r]=await Promise.all([api('/api/admin/overview'),api('/api/admin/users'),api('/api/admin/payments'),api('/api/admin/print_requests')]);
 U=u;PAY=p.payments||[];PR=r.requests||[];
 $('ov').innerHTML=[['Parents',o.parents],['School stations',o.stations],['Children',o.children],['Active cards',o.active_cards],['Active trackers',o.active_trackers],
  ['Revenue this month','R'+(o.revenue_month||0)],['Payments waiting',o.pending_payments],['Reprints waiting',o.reprints_waiting],['Groups',o.groups]].map(([n,v])=>`<div class="st"><h2>${esc(v??0)}</h2><p>${n}</p></div>`).join('');
 drawPay();drawPrt();drawKids();drawPar();drawSta();drawGrp()}
function drawPay(){$('pay').innerHTML=PAY.map(p=>`<div class="row"><div class="m"><b>${esc(p.reference)} · R${esc(p.amount)}</b><small>${esc(p.parent_username)} · ${fd(p.created_at)}</small><small>${(p.items||[]).map(i=>esc(i.name)+' ('+esc(i.plan)+')').join(', ')}</small></div>
 <span class="tag ${p.status==='paid'?'ok':'wn'}">${esc(p.status)}${p.method?' · '+esc(p.method):''}</span>${p.status==='pending'?`<button class="b o" onclick="markPaid('${p.id}')">Mark paid</button>`:''}</div>`).join('')||empty}
async function markPaid(id){if(!confirm('Confirm the money is in the bank? This activates the cards.'))return;await api('/api/admin/payments/mark_paid',{id});load()}
function drawPrt(){const f=$('pf').value;$('prt').innerHTML=PR.filter(r=>!f||r.status===f).map(r=>{const c=r.child||{};
 return `<div class="row"><div class="m"><b>${esc(c.name)} ${esc(c.surname)}</b><small>${esc(c.school_name)} · Grade ${esc(c.grade||'-')} · parent ${esc(r.parent_username)}</small>
 <small>Requested ${fd(r.requested_at)}${r.printed_at?' · printed '+fd(r.printed_at):''}${r.reason?' · reason: '+esc(r.reason):''}</small></div>
 <span class="tag ${r.status==='printed'?'ok':'wn'}">${esc(r.status)}</span>
 ${r.status==='reprint_pending'?`<button class="b o" onclick="decide('${r.id}',1)">Approve</button><button class="b r" onclick="decide('${r.id}',0)">Decline</button>`:''}</div>`}).join('')||empty}
async function decide(id,approve){await api('/api/admin/print/decide',{id,approve:!!approve});load()}
function drawKids(){const q=$('kq').value.toLowerCase();$('kid').innerHTML=(U.children||[]).filter(k=>(k.name+' '+k.surname+' '+k.school_name+' '+k.parent_username).toLowerCase().includes(q)).map(k=>
 `<div class="row"><div class="m"><b>${esc(k.name)} ${esc(k.surname)}</b><small>${esc(k.school_name)} · Grade ${esc(k.grade||'-')} · parent ${esc(k.parent_username)}</small>
 <small>${active(k)?esc(k.plan)+' until '+fd(k.paid_until):'No active plan'}${k.tracker_device_id?' · tracker '+esc(k.tracker_device_id):''}</small></div>
 <span class="tag ${active(k)?'ok':'wn'}">${active(k)?'active':'inactive'}</span><button class="b g" onclick="setPlan('${k.id}')">Set plan</button></div>`).join('')||empty}
async function setPlan(id){const p=prompt('Plan: type  card  or  card_tracker');if(!['card','card_tracker'].includes(p))return;const d=prompt('Add how many days? (30 = one month)','30');if(!d)return;
 const r=await api('/api/admin/children/set_plan',{child_id:id,plan:p,days:+d});if(r.status!=='success')alert(r.message||'Failed');load()}
function drawPar(){const q=$('pq').value.toLowerCase();$('par').innerHTML=(U.general_users||[]).filter(u=>(u.name+u.username+u.email).toLowerCase().includes(q)).map(u=>
 `<div class="row"><div class="m"><b>${esc(u.name)}</b><small>${esc(u.username)} · ${esc(u.email)}</small></div><button class="b r" onclick="delUser('${esc(u.username)}')">Delete</button></div>`).join('')||empty}
function drawSta(){$('sta').innerHTML=(U.principals||[]).map(u=>`<div class="row"><div class="m"><b>${esc(u.school_name)}</b><small>Code ${esc(u.school_code)} · ${esc(u.name)} · ${esc(u.email)}</small></div><button class="b r" onclick="delUser('${esc(u.username)}')">Delete</button></div>`).join('')||empty}
function drawGrp(){$('grp').innerHTML=(U.communities||[]).map(g=>`<div class="row"><div class="m"><b>${esc(g.name)}</b><small>${esc([g.town,g.province].filter(Boolean).join(', '))} · by ${esc(g.created_by)}</small></div><button class="b r" onclick="delGrp('${g.id}')">Delete</button></div>`).join('')||empty}
async function delUser(u){if(!confirm('Delete '+u+' and all their children and data? This cannot be undone.'))return;await api('/api/admin/delete_user',{username:u});load()}
async function delGrp(id){if(!confirm('Delete this group and all its messages?'))return;await api('/api/admin/delete_group',{id});load()}
load();
</script></body></html>
