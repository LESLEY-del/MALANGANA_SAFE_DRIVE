<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAFE DRIVE - Reset Password</title> 
    <style> 
        body { background-color: #0f172a; margin: 0; font-family: Arial, sans-serif; display: flex; flex-direction: column; min-height: 100vh; } 
        #header { width: 100vw; height: 15vh; background-color: #020218; display: flex; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); } 
        
        .back-link { position: absolute; top: 30px; left: 30px; color: #94a3b8; text-decoration: none; font-size: 13px; font-weight: bold; transition: color 0.3s; }
        .back-link:hover { color: #38bdf8; }

        #container {  
            width: 90%;
            max-width: 350px; background-color: #1e293b; margin: 5vh auto;  
            padding: 40px; border-radius: 40px; text-align: center; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            box-sizing: border-box; position: relative;
        } 
        .input-box {  
            background-color: #334155; border: 1px solid #475569;  
            border-radius: 20px; width: 100%; height: 45px;  
            padding: 0 15px; margin-bottom: 20px; outline: none; color: white;
            box-sizing: border-box;
        } 
        .input-box::placeholder { color: #94a3b8; }
        .input-box:focus { border-color: #38bdf8; }
        .btn {  
            background-color: #38bdf8; color: #020218; width: 100%;  
            height: 50px; border: none; border-radius: 25px;  
            cursor: pointer; font-weight: bold; transition: 0.3s;
        } 
        .btn:hover { background-color: #7dd3fc; }
        .btn:disabled { background-color: #475569; cursor: not-allowed; }
    </style> 
</head> 
<body> 
    <div id="header"> 
        <h1 style="color: white; margin-left: 5vw;">SAFE DRIVE</h1> 
    </div> 
 
    <div id="container"> 
        <a href="login.html" class="back-link">&#8592; Back</a>
        <h2 style="color: #f8fafc; margin-top: 10px;">RESET PASSWORD</h2> 
        <p style="font-size: 13px; color: #94a3b8; margin-bottom: 25px;">Enter your Username. A verification code will be sent to the email attached to this account.</p> 
          
        <input type="text" id="username" placeholder="Your Registered Username" class="input-box"> 
        <button id="sendCodeBtn" class="btn">SEND VERIFICATION CODE</button> 
 
        <div id="resetFields" style="display: none; margin-top: 30px; border-top: 1px solid #334155; padding-top: 20px;"> 
            <p style="font-size: 13px; color: #2ecc71; font-weight: bold;">Code sent! Check your inbox.</p> 
            <input type="text" id="vCode" placeholder="Enter 6-Digit Code" class="input-box"> 
            <input type="password" id="newPass" placeholder="Enter New Password" class="input-box"> 
            <button id="submitResetBtn" class="btn" style="background-color: #27ae60; color: white;">UPDATE PASSWORD</button> 
        </div> 
    </div> 
 
    <script> 
        const sendBtn = document.getElementById('sendCodeBtn'); 
        const resetBtn = document.getElementById('submitResetBtn'); 
        const resetFields = document.getElementById('resetFields'); 
        const uInput = document.getElementById('username');
 
        // Step 1: Request Code using Username
        sendBtn.onclick = async () => { 
            const username = uInput.value.trim().toLowerCase(); 
            if(!username) return alert("Please enter your Username!"); 
 
            sendBtn.innerText = "SENDING..."; 
            sendBtn.disabled = true;

            try {
                const res = await fetch('/api/forgot-password', { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({ username }) 
                }); 
                const data = await res.json(); 

                if(data.status === 'success') { 
                    resetFields.style.display = 'block'; 
                    sendBtn.style.display = 'none'; 
                    uInput.disabled = true; // Lock username so they can't change it mid-reset
                } else { 
                    alert(data.message); 
                    sendBtn.innerText = "SEND VERIFICATION CODE"; 
                    sendBtn.disabled = false;
                } 
            } catch(e) {
                alert("Server connection failed.");
                sendBtn.innerText = "SEND VERIFICATION CODE"; 
                sendBtn.disabled = false;
            }
        }; 
 
        // Step 2: Submit New Password 
        resetBtn.onclick = async () => { 
            const username = uInput.value.trim().toLowerCase(); 
            const code = document.getElementById('vCode').value.trim(); 
            const newPassword = document.getElementById('newPass').value.trim(); 

            if(!code || !newPassword) return alert("Please enter the code and a new password.");
 
            resetBtn.innerText = "UPDATING...";
            resetBtn.disabled = true;

            try {
                const res = await fetch('/api/reset-password', { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({ username, code, newPassword }) 
                }); 
                const data = await res.json(); 

                if(data.status === 'success') { 
                    alert("Password successfully changed! Returning to login."); 
                    window.location.href = "login.html"; 
                } else { 
                    alert(data.message); 
                    resetBtn.innerText = "UPDATE PASSWORD";
                    resetBtn.disabled = false;
                } 
            } catch(e) {
                alert("Server connection failed.");
                resetBtn.innerText = "UPDATE PASSWORD";
                resetBtn.disabled = false;
            }
        }; 
    </script> 
</body> 
</html>
