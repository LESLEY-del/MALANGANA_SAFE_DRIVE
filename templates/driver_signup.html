<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Registration | Safe Drive</title> 
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --bg: #121212;
            --card: #1e1e26;
            --input: #2a2a35;
            --text-dim: #94a3b8;
            --error: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
        }
        body { background: var(--bg); font-family: sans-serif; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; padding: 20px; }
        
        .card { background: var(--card); padding:35px; border-radius:35px; width:100%; max-width:400px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.5); box-sizing: border-box; position: relative; }
        
        .back-link {
            position: absolute;
            top: 25px;
            left: 25px;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            transition: color 0.3s;
        }
        .back-link:hover { color: var(--primary); }

        .input-box { width:100%; background: var(--input); border:2px solid transparent; padding:12px; margin:8px 0; border-radius:18px; outline:none; color:white; box-sizing: border-box; }
        .input-box:focus { border-color: var(--primary); }
        select.input-box { appearance: none; cursor: pointer; }
        
        .btn { background: var(--primary); color:white; width:100%; padding:15px; border-radius:25px; border:none; cursor:pointer; font-weight:bold; margin-top:15px; text-transform: uppercase; transition: 0.3s; }
        .btn:disabled { background:#334155; cursor:not-allowed; color: #64748b; }
        .btn-secondary { background: transparent; border: 2px solid var(--text-dim); color: var(--text-dim); }
        .btn-secondary:hover { border-color: var(--warning); color: var(--warning); }

        .error-text { color: var(--error); font-size: 11px; font-weight: 800; display: none; margin-top: -5px; margin-bottom: 5px; text-align: left; padding-left: 10px; }
        .warning-text { color: var(--warning); font-size: 11px; font-weight: bold; margin-top: -5px; margin-bottom: 5px; text-align: left; padding-left: 10px; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(5px);
        }
        .modal {
            background: var(--card); padding: 35px; border-radius: 25px; text-align: center; width: 90%; max-width: 380px; box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        .code-input {
            font-size: 24px; letter-spacing: 8px; text-align: center; font-weight: bold;
        }

        #cameraModal.modal-overlay {
            padding: 0;
            align-items: stretch;
        }
        #cameraModal .modal {
            width: 100%;
            max-width: 100%;
            height: 100%;
            max-height: 100vh;
            border-radius: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            box-shadow: none;
        }
        .cam-top-bar {
            padding: max(20px, env(safe-area-inset-top)) 20px 15px;
            text-align: center;
            background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
            position: relative;
            z-index: 2;
        }
        .cam-top-bar h3 { margin: 0; color: white; font-size: 16px; font-weight: 700; letter-spacing: 0.5px; }
        .cam-step-dots { display: flex; justify-content: center; gap: 6px; margin-top: 10px; }
        .cam-step-dots span { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.25); transition: 0.3s; }
        .cam-step-dots span.active { background: var(--primary); width: 20px; border-radius: 3px; }

        .camera-container {
            flex: 1;
            width: 100%;
            background: #000;
            overflow: hidden;
            position: relative;
            margin: 0;
            border: none;
            border-radius: 0;
        }
        #video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        #canvas { display: none; }

        .camera-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 62vw; max-width: 220px; height: 78vw; max-height: 280px;
            border: 3px dashed rgba(255,255,255,0.5);
            border-radius: 50%; pointer-events: none;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 0 2000px rgba(0,0,0,0.45);
        }
        .camera-overlay.locked { border-color: var(--success); border-style: solid; }
        .camera-overlay .scan-line {
            position: absolute; left: 8%; right: 8%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            top: 0; opacity: 0; box-shadow: 0 0 8px var(--primary);
        }
        .camera-overlay.scanning .scan-line {
            opacity: 1;
            animation: scanSweep 1.2s ease-in-out infinite;
        }
        @keyframes scanSweep {
            0% { top: 5%; }
            50% { top: 92%; }
            100% { top: 5%; }
        }

        .cam-bottom-bar {
            padding: 20px 20px max(20px, env(safe-area-inset-bottom));
            background: linear-gradient(0deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 70%, transparent 100%);
            position: relative;
            z-index: 2;
            margin-top: -100px;
        }
        #camStatus {
            font-size: 14px; color: white; font-weight: 600; text-align: center;
            min-height: 20px; margin: 0 0 15px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }

        #licenseButtons { display: none; gap: 10px; margin-top: 0; flex-direction: column; }
        #schoolCodeSection { display: none; width: 100%; text-align: left; margin-top: 10px; }
        #dynamic_school_codes { margin-top: 5px; }
    </style>
</head>
<body>

    <div class="card">
        <a href="choice.html" class="back-link">&#8592; Back</a>
        
        <h2 style="color:#ffffff; margin-top: 10px;">DRIVER SIGNUP</h2>
        <p style="font-size:12px; color:var(--text-dim); margin-bottom:15px;">ID & Vehicle Verification</p>

        <input type="text" id="name" placeholder="Full Name" class="input-box">
        <div class="warning-text">Name MUST match your Driver's License exactly.</div>

        <input type="tel" id="phone" placeholder="Phone Number" class="input-box">
        
        <input type="text" id="username" placeholder="Create Username" class="input-box">
        <div id="uError" class="error-text">USERNAME TAKEN</div> 

        <input type="email" id="email" placeholder="Official Email Address" class="input-box">
        <input type="text" id="vehicle" placeholder="Vehicle Type (e.g. Toyota Quantum)" class="input-box">
        
        <input type="text" id="number_plate" placeholder="Number Plate (e.g. ABC 123 GP)" class="input-box" style="text-transform: uppercase;">
        <div id="npError" class="error-text">CAR ALREADY REGISTERED</div> 

        <select id="transport_type" class="input-box">
            <option value="" disabled selected>Select Transport Type</option>
            <option value="school_events">School Transport and Events</option>
            <option value="door_to_door">Door to Door</option>
            <option value="events_only">Events Only</option>
        </select>

        <div id="schoolCodeSection">
            <label style="font-size: 12px; color: var(--text-dim); padding-left: 10px;">How many school codes?</label>
            <input type="number" id="num_school_codes" placeholder="Enter number (e.g. 2)" class="input-box" min="1" max="10">
            <div id="dynamic_school_codes"></div>
        </div>

        <input type="password" id="password" placeholder="Password" class="input-box">

        <label style="display:flex; align-items:flex-start; gap:10px; text-align:left; font-size:12px; color:var(--text-dim); margin: 15px 5px 5px;">
            <input type="checkbox" id="termsCheckbox" style="margin-top:2px; width:16px; height:16px; flex-shrink:0; accent-color: var(--primary);">
            <span>I have read and agree to the <a href="terms.html" target="_blank" style="color: var(--primary);">Terms & Conditions</a> and <a href="privacy.html" target="_blank" style="color: var(--primary);">Privacy Policy</a>, and confirm the details I've provided are accurate.</span>
        </label>

        <button class="btn" id="startVerifyBtn" disabled>START VERIFICATION</button>
    </div>

    <div class="modal-overlay" id="cameraModal">
        <div class="modal">
            <div class="cam-top-bar">
                <h3 id="camModalTitle">Face Scan</h3>
                <div class="cam-step-dots">
                    <span id="dotFace" class="active"></span>
                    <span id="dotLicense"></span>
                </div>
            </div>

            <div class="camera-container" id="camContainer">
                <video id="video" autoplay muted playsinline></video>
                <div class="camera-overlay" id="camOverlay"><div class="scan-line"></div></div>
                <canvas id="canvas"></canvas>
            </div>

            <div class="cam-bottom-bar">
                <p id="camStatus">Initializing camera...</p>
                <div id="licenseButtons">
                    <button class="btn" id="captureLicenseBtn">CAPTURE LICENSE</button>
                    <button class="btn btn-secondary" id="skipLicenseBtn">SKIP FOR NOW</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="verifyModal">
        <div class="modal">
            <h3 style="color: white; margin-top: 0;">Verification Required</h3>
            <p style="color: var(--text-dim); font-size: 13px;">Identity scanned. Enter the 4-digit verification code sent to your email.</p>
            <input type="text" id="vCodeInput" class="input-box code-input" placeholder="0000" maxlength="4" autocomplete="off">
            <button class="btn" id="verifyBtn">CONFIRM CODE</button>
            <button class="btn btn-secondary" id="cancelVerifyBtn" style="margin-top: 10px; padding: 10px;">Cancel</button>
        </div>
    </div>

    <script>
        const startVerifyBtn = document.getElementById('startVerifyBtn');
        const uInput = document.getElementById('username');
        const npInput = document.getElementById('number_plate');
        const transportType = document.getElementById('transport_type');
        
        const cameraModal = document.getElementById('cameraModal');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const camStatus = document.getElementById('camStatus');
        const camOverlay = document.getElementById('camOverlay');
        const licenseButtons = document.getElementById('licenseButtons');
        const camContainer = document.getElementById('camContainer');
        const termsCheckbox = document.getElementById('termsCheckbox');

        let faceImageData = null;
        let licenseImageData = null;
        let usernameError = false;
        let plateError = false;
        let cameraStream = null;

        function validateErrors() {
            startVerifyBtn.disabled = (usernameError || plateError || !termsCheckbox.checked);
        }

        termsCheckbox.addEventListener('change', validateErrors);

        uInput.addEventListener('input', async () => {
            const u = uInput.value.trim().toLowerCase();
            if (u.length < 2) {
                usernameError = false;
                document.getElementById('uError').style.display = 'none';
                validateErrors();
                return;
            }
            try {
                const res = await fetch('/api/check_availability', {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ username: u })
                });
                const data = await res.json();
                usernameError = !!data.username_taken;
            } catch(e) { usernameError = false; }
            document.getElementById('uError').style.display = usernameError ? 'block' : 'none';
            validateErrors();
        });

        npInput.addEventListener('input', async () => {
            const np = npInput.value.trim().toUpperCase();
            if (np.length < 3) {
                plateError = false;
                document.getElementById('npError').style.display = 'none';
                validateErrors();
                return;
            }
            try {
                const res = await fetch('/api/check_availability', {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ number_plate: np })
                });
                const data = await res.json();
                plateError = !!data.plate_taken;
            } catch(e) { plateError = false; }
            document.getElementById('npError').style.display = plateError ? 'block' : 'none';
            validateErrors();
        });

        transportType.addEventListener('change', () => {
            const scSection = document.getElementById('schoolCodeSection');
            if (transportType.value === 'school_events') {
                scSection.style.display = 'block';
            } else {
                scSection.style.display = 'none';
                document.getElementById('dynamic_school_codes').innerHTML = '';
            }
        });

        document.getElementById('num_school_codes').addEventListener('input', (e) => {
            const count = parseInt(e.target.value) || 0;
            const container = document.getElementById('dynamic_school_codes');
            container.innerHTML = ''; 
            for(let i = 0; i < count; i++) {
                const inp = document.createElement('input');
                inp.type = 'text';
                inp.className = 'input-box school-code-input';
                inp.placeholder = `Enter School Code ${i + 1}`;
                container.appendChild(inp);
            }
        });

        startVerifyBtn.addEventListener('click', async () => {
            if(!document.getElementById('name').value || !document.getElementById('phone').value || !uInput.value || !npInput.value || !transportType.value) {
                return alert("Please fill all required details (including Phone Number).");
            }

            if (transportType.value === 'school_events') {
                const scInputs = document.querySelectorAll('.school-code-input');
                if (scInputs.length === 0) return alert("Please specify how many school codes you need.");
                for (let i = 0; i < scInputs.length; i++) {
                    if (!scInputs[i].value.trim()) return alert(`Please fill in School Code ${i+1}`);
                }
            }

            cameraModal.style.display = 'flex';
            await startCamera();
            runFaceAutoScan();
        });

        async function startCamera() {
            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                video.srcObject = cameraStream;
            } catch (err) {
                camStatus.innerText = "Camera Access Denied!";
                camStatus.style.color = "var(--error)";
            }
        }

        function stopCamera() {
            if(cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
            }
        }

        function runFaceAutoScan() {
            document.getElementById('camModalTitle').innerText = "Face Scan";
            document.getElementById('dotFace').classList.add('active');
            document.getElementById('dotLicense').classList.remove('active');
            camOverlay.classList.remove('locked', 'scanning');
            camOverlay.style.width = "";
            camOverlay.style.height = "";
            camOverlay.style.maxWidth = "220px";
            camOverlay.style.maxHeight = "280px";
            camOverlay.style.borderRadius = "50%";
            licenseButtons.style.display = 'none';

            setTimeout(() => { camStatus.innerText = "Positioning face..."; }, 500);
            setTimeout(() => { camStatus.innerText = "Please move a little closer..."; }, 2500);
            setTimeout(() => { camStatus.innerText = "Center your face..."; }, 4500);
            setTimeout(() => { 
                camStatus.innerText = "Perfect! Hold still..."; 
                camOverlay.classList.add('locked');
            }, 6000);
            setTimeout(() => {
                camStatus.innerText = "Scanning...";
                camOverlay.classList.add('scanning');
            }, 6600);
            setTimeout(() => {
                captureFrame();
                faceImageData = canvas.toDataURL('image/jpeg');
                camOverlay.classList.remove('scanning');
                switchToLicenseScan();
            }, 7800);
        }

        function switchToLicenseScan() {
            document.getElementById('camModalTitle').innerText = "Driver's License";
            document.getElementById('dotFace').classList.remove('active');
            document.getElementById('dotLicense').classList.add('active');
            camStatus.innerText = "Hold your Driver's License steady inside the frame, then capture.";
            camOverlay.classList.remove('locked', 'scanning');

            camOverlay.style.maxWidth = "300px";
            camOverlay.style.maxHeight = "190px";
            camOverlay.style.width = "80vw";
            camOverlay.style.height = "50vw";
            camOverlay.style.borderRadius = "14px";

            licenseButtons.style.display = 'flex';
        }

        document.getElementById('captureLicenseBtn').addEventListener('click', () => {
            captureFrame();
            licenseImageData = canvas.toDataURL('image/jpeg');
            camStatus.innerText = "License captured!";
            camOverlay.classList.add('locked');
            processBackendSubmission();
        });

        document.getElementById('skipLicenseBtn').addEventListener('click', () => {
            alert("NOTICE: Please ensure you capture your driver's license within 7 days, or your account will be deactivated.");
            licenseImageData = null; 
            processBackendSubmission();
        });

        function captureFrame() {
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
        }

        async function processBackendSubmission() {
            document.getElementById('camModalTitle').innerText = "Uploading...";
            camStatus.innerText = "Please wait, sending data to AI servers...";
            licenseButtons.style.display = 'none';

            let codesArray = [];
            if (transportType.value === 'school_events') {
                document.querySelectorAll('.school-code-input').forEach(inp => codesArray.push(inp.value.trim().toUpperCase()));
            }

            const payload = {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value, 
                username: uInput.value.trim().toLowerCase(),
                email: document.getElementById('email').value.trim(),
                vehicle_type: document.getElementById('vehicle').value,
                number_plate: npInput.value.trim().toUpperCase(),
                transport_type: transportType.value,
                school_codes: codesArray,
                password: document.getElementById('password').value,
                role: 'driver',
                face_image: faceImageData,
                license_image: licenseImageData,
                terms_accepted: termsCheckbox.checked
            };

            try {
                const res = await fetch('/api/driver/signup', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                
                const data = await res.json();
                cameraModal.style.display = 'none';
                stopCamera(); 

                if (data.status === 'pending') {
                    document.getElementById('verifyModal').style.display = 'flex';
                    document.getElementById('vCodeInput').focus();
                } else {
                    alert(data.message || "Detection Failed. Please try again.");
                }
            } catch (e) {
                alert("Safe Drive AI Systems are currently offline.");
                cameraModal.style.display = 'none';
                stopCamera();
            }
        }

    document.getElementById('verifyBtn').addEventListener('click', async () => {
            const code = document.getElementById('vCodeInput').value.trim();
            if(code.length !== 4) return alert("Code must be 4 digits.");

            const vBtn = document.getElementById('verifyBtn');
            vBtn.innerText = "CHECKING...";
            vBtn.disabled = true;

            try {
                const vRes = await fetch('/api/verify-and-save', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        username: uInput.value.trim().toLowerCase(),
                        code: code,
                        verification_image: faceImageData
                    })
                });
                
                const final = await vRes.json();
                if(final.status === 'success') {
                    alert("Account Verified & Activated!");
                    window.location.href = 'login.html';
                } else {
                    alert("Invalid Security Code.");
                    vBtn.innerText = "CONFIRM CODE";
                    vBtn.disabled = false;
                }
            } catch (e) {
                alert("Verification Server Error.");
                vBtn.innerText = "CONFIRM CODE";
                vBtn.disabled = false;
            }
        });

        document.getElementById('cancelVerifyBtn').addEventListener('click', () => {
            document.getElementById('verifyModal').style.display = 'none';
            alert("Verification cancelled. Your account remains inactive.");
        });
    </script>
</body>
</html>
