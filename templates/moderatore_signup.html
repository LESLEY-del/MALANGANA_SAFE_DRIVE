<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safe Drive | Moderator Registration</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --bg: #0f172a; 
            --card: #1e293b; 
            --accent: #0eb8a6; 
            --border: #334155; 
            --danger: #ef4444;
            --text-muted: #94a3b8;
        }
        body { background: var(--bg); font-family: 'Inter', sans-serif; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; overflow-x: hidden; }
        .card { background: var(--card); padding: 40px; border-radius: 30px; width: 100%; max-width: 440px; border: 1px solid var(--border); box-sizing: border-box; position: relative; z-index: 10; }
        
        input, select { width: 100%; padding: 14px; background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: white; border-radius: 12px; box-sizing: border-box; margin-bottom: 20px; outline: none; font-family: inherit; font-size: 14px; }
        input:focus, select:focus { border-color: var(--accent); background: rgba(0,0,0,0.5); }
        input.field-error { border-color: var(--danger) !important; }
        
        .inline-feedback-msg { font-size: 12px; color: var(--danger); margin-top: -15px; margin-bottom: 15px; font-weight: 600; display: none; padding-left: 4px; }
        
        .btn { width: 100%; padding: 15px; background: var(--accent); color: #020218; border: none; border-radius: 12px; font-weight: 800; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; transition: 0.2s; }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn:disabled { background: #475569; color: var(--text-muted); cursor: not-allowed; transform: none; }

        /* 🎥 TRUE IMMERSIVE UNRESTRICTED FULL-SCREEN CAMERA LAYER VIEW */
        #cameraStage { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 5000; }
        video { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 1; }
        
        .camera-hud-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 40px 20px; box-sizing: border-box; background: rgba(0, 0, 0, 0.25); z-index: 2; }
        .camera-hud-title { color: var(--accent); font-weight: 800; font-size: 18px; text-transform: uppercase; letter-spacing: 2px; background: rgba(2, 2, 24, 0.85); padding: 14px 28px; border-radius: 30px; border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        
        /* Clear HUD corner targets overlay to hint layout centering while allowing full face scans */
        .camera-hud-tracking-guide { width: 80%; max-width: 450px; height: 60vh; border: 2px dashed rgba(14, 184, 166, 0.4); border-radius: 20px; position: relative; margin-top: auto; margin-bottom: auto; pointer-events: none; }

        /* 🚨 CENTRED DESIGNER POPUP OVERLAY DIALOG MODAL */
        .app-alert-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); display: flex; justify-content: center; align-items: center; z-index: 9999; opacity: 0; pointer-events: none; backdrop-filter: blur(8px); transition: opacity 0.3s ease; }
        .app-alert-overlay.show { opacity: 1; pointer-events: auto; }
        .app-alert-box { background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 35px 30px; width: 85%; max-width: 380px; text-align: center; box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6); transform: scale(0.9); transition: transform 0.3s ease; }
        .app-alert-overlay.show .app-alert-box { transform: scale(1); }
        .app-alert-message { color: white; font-size: 14px; line-height: 1.6; margin-bottom: 25px; margin-top: 0; }
        .btn-alert-close { background: var(--accent); color: #020218; border: none; padding: 12px 0; border-radius: 12px; font-weight: 800; font-size: 13px; width: 100%; cursor: pointer; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="card" id="formWrapperCard">
        <h2 style="margin-top:0; color: var(--accent); font-weight: 800; letter-spacing: -0.5px;">MODERATOR SIGNUP</h2>
        
        <div id="setupStage">
            <input type="text" id="schoolCode" placeholder="SCHOOL ACCESS CODE">
            <input type="text" id="fullname" placeholder="FULL NAME">
            <input type="email" id="email" placeholder="EMAIL ADDRESS">
            
            <input type="text" id="username" placeholder="ACCOUNT USERNAME" oninput="handleLiveUsernameCheck()">
            <div id="usernameFeedback" class="inline-feedback-msg"></div>

            <input type="password" id="password" placeholder="PASSWORD">
            <input type="text" id="grade" placeholder="GRADE LEVEL (e.g., 10A)">
            
            <label style="display: block; font-size:11px; font-weight:800; color:var(--accent); text-transform: uppercase; margin-bottom: 10px; letter-spacing: 0.5px;">Designated System Level</label>
            <select id="modType" onchange="evaluateRoleInputs()">
                <option value="teacher">Lead Teacher (Generates Code)</option>
                <option value="assistant">Assistant Personnel (Requires Code)</option>
            </select>

            <div id="teacherKeyBox" style="display:block;">
                <input type="text" id="generatedCode" placeholder="Create Entry Passcode for Assistants">
            </div>
            <div id="assistantKeyBox" style="display:none;">
                <input type="text" id="providedCode" placeholder="Enter Lead Teacher's Passcode">
            </div>

            <button class="btn" id="proceedBtn" onclick="validateBoundariesBeforeCamera()">PROCEED TO SCAN</button>
        </div>

        <div id="otpStage" style="display:none;">
            <p style="font-size: 14px; color: var(--text-muted); line-height: 1.5; margin-bottom: 25px;">A secure verification code has been dispatched to your registered email profile lines. Please check your inbox.</p>
            <input type="number" id="otpPin" placeholder="ENTER 4-DIGIT PIN">
            <button class="btn" onclick="commitRegistration()">AUTHENTICATE PROFILE</button>
        </div>
    </div>

    <div id="cameraStage">
        <video id="video" autoplay playsinline></video>
        <div class="camera-hud-overlay">
            <div class="camera-hud-title">Live Biometric Feed: Unrestricted Capture</div>
            <div class="camera-hud-tracking-guide"></div>
            <button class="btn" style="max-width: 340px; box-shadow: 0 10px 30px rgba(0,0,0,0.6);" onclick="captureBiometrics()">CAPTURE & PROCESS MATRIX</button>
        </div>
    </div>

    <div id="appAlertOverlay" class="app-alert-overlay">
        <div class="app-alert-box">
            <h3 style="margin-top: 0; color: var(--accent); font-size: 18px; margin-bottom: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;">System Notice</h3>
            <p id="appAlertMessage" class="app-alert-message"></p>
            <button onclick="closeAppAlert()" class="btn-alert-close">ACKNOWLEDGE</button>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://mlzpmiccmggfwenfzvsy.supabase.co';
        const supabaseKey = 'sb_publishable_ehnY1o3Vm1YCHVhaL5NL-Q_UZN-xRIp';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        let base64ImageFrame = null;
        let streamThreadReference = null;
        let usernameValidityState = false;

        // Custom centered modal interface logic mapping
        function showAppAlert(message, title="Notice") {
            document.getElementById("appAlertMessage").innerText = message;
            document.getElementById("appAlertOverlay").classList.add("show");
        }
        function closeAppAlert() { document.getElementById("appAlertOverlay").classList.remove("show"); }

        function evaluateRoleInputs() {
            const isTeacher = document.getElementById('modType').value === 'teacher';
            document.getElementById('teacherKeyBox').style.display = isTeacher ? 'block' : 'none';
            document.getElementById('assistantKeyBox').style.display = isTeacher ? 'none' : 'block';
        }

        async function handleLiveUsernameCheck() {
            const field = document.getElementById('username');
            const feedback = document.getElementById('usernameFeedback');
            const u = field.value.trim().toLowerCase();

            if (!u) {
                field.classList.remove('field-error');
                feedback.style.display = 'none';
                usernameValidityState = false;
                return;
            }

            try {
                const { data } = await _supabase.from('users').select('username').eq('username', u).maybeSingle();
                if (data) {
                    field.classList.add('field-error');
                    feedback.innerText = "❌ Username already registered to an active profile.";
                    feedback.style.display = 'block';
                    usernameValidityState = false;
                } else {
                    field.classList.remove('field-error');
                    feedback.style.display = 'none';
                    usernameValidityState = true;
                }
            } catch(e) { console.error(e); }
        }

        async function validateBoundariesBeforeCamera() {
            const sc = document.getElementById('schoolCode').value.trim().toUpperCase();
            const gr = document.getElementById('grade').value.trim().toUpperCase();
            const roleSelection = document.getElementById('modType').value;
            const passcode = roleSelection === 'teacher' ? document.getElementById('generatedCode').value.trim() : document.getElementById('providedCode').value.trim();

            if(!sc || !gr || !passcode || !document.getElementById('fullname').value || !document.getElementById('email').value || !document.getElementById('password').value) {
                return showAppAlert("Security Parameters Missing: Please fill all configuration form fields context parameters.");
            }

            if(!usernameValidityState) {
                return showAppAlert("Identity Conflict: Please adjust your unique username field criteria to continue.");
            }

            document.getElementById('proceedBtn').disabled = true;

            try {
                const { data: records } = await _supabase
                    .from('users')
                    .select('username, role, moderator_type')
                    .eq('school_code', sc)
                    .eq('moderated_grade', gr)
                    .eq('role', 'moderator')
                    .eq('moderator_type', roleSelection);

                if(records && records.length >= 1) {
                    document.getElementById('proceedBtn').disabled = false;
                    const errorMsg = roleSelection === 'teacher' 
                        ? `CRITICAL PROTECTION ERROR: A registered Lead Teacher already exists for Grade ${gr} at this institution. Duplicate registrations are strictly rejected.`
                        : `CRITICAL PROTECTION ERROR: A registered Assistant Personnel position is already filled for Grade ${gr} at this institution slots grid.`;
                    return showAppAlert(errorMsg, "BOUNDARY QUOTA EXCEEDED");
                }

                const boundaryPayload = {
                    school_code: sc,
                    grade: gr,
                    moderator_type: roleSelection,
                    assistant_passcode: passcode
                };

                const res = await fetch('http://127.0.0.1:5000/api/moderator/verify_boundaries', {
                    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(boundaryPayload)
                });
                const data = await res.json();
                
                if(!res.ok) {
                    document.getElementById('proceedBtn').disabled = false;
                    return showAppAlert(data.message || "Boundary checking validation failure pipeline anomaly.", "VALIDATION FAILURE");
                }

                // Show full-screen video background stage layout
                document.getElementById('formWrapperCard').style.display = 'none';
                document.getElementById('cameraStage').style.display = 'block';
                startBiometricStream();

            } catch(err) {
                document.getElementById('proceedBtn').disabled = false;
                showAppAlert("Database connection timeout error. Please retry.");
            }
        }

        function startBiometricStream() {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 1920 }, height: { ideal: 1080 } } }).then(stream => {
                streamThreadReference = stream;
                document.getElementById('video').srcObject = stream;
            }).catch(() => {
                closeFullScreenCameraLayout();
                showAppAlert("Biometric frame channel lock error. Camera hardware inaccessible.");
            });
        }

        function closeFullScreenCameraLayout() {
            if(streamThreadReference) {
                streamThreadReference.getTracks().forEach(track => track.stop());
            }
            document.getElementById('cameraStage').style.display = 'none';
            document.getElementById('formWrapperCard').style.display = 'block';
            document.getElementById('proceedBtn').disabled = false;
        }

        function captureBiometrics() {
            const video = document.getElementById('video');
            const canvas = document.createElement('canvas');
            
            // Capture matching true video context dimensions
            canvas.width = video.videoWidth || 1280; 
            canvas.height = video.videoHeight || 720;
            
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            base64ImageFrame = canvas.toDataURL('image/jpeg');

            const payload = {
                school_code: document.getElementById('schoolCode').value.toUpperCase().trim(),
                name: document.getElementById('fullname').value.trim(),
                email: document.getElementById('email').value.trim(),
                username: document.getElementById('username').value.toLowerCase().trim(),
                password: document.getElementById('password').value,
                grade: document.getElementById('grade').value.toUpperCase().trim(),
                moderator_type: document.getElementById('modType').value,
                assistant_passcode: document.getElementById('modType').value === 'teacher' ? document.getElementById('generatedCode').value.trim() : document.getElementById('providedCode').value.trim(),
                face_image: base64ImageFrame
            };

            if(streamThreadReference) streamThreadReference.getTracks().forEach(t => t.stop());

            fetch('http://127.0.0.1:5000/api/moderator/signup', {
                method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)
            }).then(res => res.json().then(data => {
                if(data.status === 'pending') {
                    document.getElementById('cameraStage').style.display = 'none';
                    document.getElementById('formWrapperCard').style.display = 'block';
                    document.getElementById('setupStage').style.display = 'none';
                    document.getElementById('otpStage').style.display = 'block';
                } else {
                    closeFullScreenCameraLayout();
                    showAppAlert(data.message || "Facial proximity boundary error. Ensure clear lighting parameters.", "BIOMETRIC FAILURE");
                }
            })).catch(() => {
                closeFullScreenCameraLayout();
                showAppAlert("AI Engine operational node timeout delay. Try tracking capture routine again.");
            });
        }

        function commitRegistration() {
            const pinVal = document.getElementById('otpPin').value;
            const userVal = document.getElementById('username').value.toLowerCase().trim();

            fetch('http://127.0.0.1:5000/api/verify-and-save', {
                method: 'POST', 
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ 
                    username: userVal, 
                    code: pinVal,
                    // FIX: Pass the captured image string variable along with the registration step!
                    verification_image: base64ImageFrame 
                })
            }).then(res => {
                if(res.ok) {
                    showAppAlert("Moderator account successfully configured! Profile established cleanly inside active institution.", "REGISTRATION SUCCESS");
                    setTimeout(() => { window.location.href = "login.html"; }, 2500);
                } else {
                    showAppAlert("PIN matching authorization failure loop node reference invalid.", "PIN MATCH ERROR");
                }
            });
        }
    </script>
</body>
</html>
